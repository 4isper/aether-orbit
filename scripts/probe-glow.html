<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head>
<body>
<script type="module">
import * as THREE from '/three.module.js'
import { EffectComposer, RenderPass, EffectPass, BloomEffect, VignetteEffect, ToneMappingEffect, ToneMappingMode } from '/postprocessing.esm.js'
const canvas = document.createElement('canvas')
canvas.width = 640; canvas.height = 400
document.body.appendChild(canvas)
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: false })
renderer.setSize(640, 400)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#000000')
const camera = new THREE.PerspectiveCamera(36, 1.6, 0.1, 500000)
camera.position.set(0, 0.137, 44879 + 0.4)
camera.lookAt(0, 0, 44879)
const noiseGLSL = `
vec3 mod289v(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289v(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permutev(vec4 x) { return mod289v(((x * 34.0) + 1.0) * x); }
float snoise(vec3 v) {
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  vec3 ii = mod289v(i);
  vec4 p = permutev(permutev(permutev(
    ii.z + vec4(0.0, i1.z, i2.z, 1.0))
    + ii.y + vec4(0.0, i1.y, i2.y, 1.0))
    + ii.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = vec4(1.0) / sqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
float fbm3n(vec3 p) {
  float value = 0.0; float amplitude = 0.5;
  for (int i = 0; i < 3; i++) { value += amplitude * snoise(p); p = p * 2.03 + vec3(13.7, 9.2, 7.5); amplitude *= 0.5; }
  return value;
}
`
const common = `
varying vec2 vLocal;
varying float vRadius;
uniform float uInner;
uniform float uOuter;
${noiseGLSL}
`
const variants = [
  { name: 'premult x0.22', frag: 'gl_FragColor = vec4(color * alpha, alpha);', scale: '0.22', local: 'vLocal * 0.22' },
  { name: 'straight x0.22', frag: 'gl_FragColor = vec4(color, alpha);', scale: '0.22', local: 'vLocal / uOuter * 3.0' },
  { name: 'premult 1.0', frag: 'gl_FragColor = vec4(color * alpha, alpha);', scale: '1.0', local: 'vLocal / uOuter * 3.0' },
  { name: 'straight 1.0', frag: 'gl_FragColor = vec4(color, alpha);', scale: '1.0', local: 'vLocal / uOuter * 3.0' },
]
const UIN = 0.9 * 23483, UOUT = 21.12 * (23483 / 9)
for (let q = 0; q < 4; q++) {
  const v = variants[q]
  const frag = `
${common}
void main() {
  float t = (vRadius - uInner) / (uOuter - uInner);
  float falloff = exp(-t * 1.6) * smoothstep(0.0, 0.15, t);
  float wisps = fbm3n(vec3(${v.local}, 3.1)) * 0.5 + 0.5;
  float alpha = falloff * (0.35 + 0.65 * wisps) * ${v.scale};
  vec3 color = vec3(1.0, 0.84, 0.62);
  ${v.frag}
}
`
  const mat = new THREE.ShaderMaterial({
    vertexShader: 'varying vec2 vLocal; varying float vRadius; void main() { vLocal = position.xy; vRadius = length(position.xy); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: frag,
    uniforms: { uInner: { value: UIN }, uOuter: { value: UOUT } },
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  })
  const mesh = new THREE.Mesh(new THREE.RingGeometry(UIN, UOUT, 160, 1), mat)
  mesh.rotation.x = -Math.PI / 2
  scene.add(mesh)
  if (q === 0) {
    const probe = new THREE.Mesh(new THREE.SphereGeometry(800, 24, 24), new THREE.MeshBasicMaterial({ color: 0xff0000 }))
    probe.position.set(0, 0, 44879)
    scene.add(probe)
  }
}
const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
composer.addPass(new EffectPass(camera, new BloomEffect({ mipmapBlur: true, intensity: 0.7, luminanceThreshold: 0.72, luminanceSmoothing: 0.32 }), new VignetteEffect({ offset: 0.2, darkness: 0.58 }), new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC })))
const labels = ['premult x0.22', 'straight x0.22', 'premult 1.0', 'straight 1.0']
let frame = 0
renderer.setAnimationLoop(() => {
  composer.render()
  frame++
})
window.__quads = variants.map(v => v.name)
</script>
</body></html>
